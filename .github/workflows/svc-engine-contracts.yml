name: SVC engine contracts
on:
  pull_request:
    paths:
      - "infer/svc_engine_bridge.py"
      - "tools/run_svc_engine.py"
      - "tools/yingmusic_svc_worker.py"
      - "tools/soulx_svc_worker.py"
      - "tests/test_svc_engine_bridge.py"
      - "tests/test_svc_studio_integration.py"
      - "infer/svc_cover_workflow.py"
      - "tools/svc_model_registry.py"
      - "ui/app.py"
      - "configs/svc_engines.json"
      - ".github/workflows/svc-engine-contracts.yml"
  push:
    branches: [master]
    paths:
      - "infer/svc_engine_bridge.py"
      - "tools/run_svc_engine.py"
      - "tools/yingmusic_svc_worker.py"
      - "tools/soulx_svc_worker.py"
      - "tests/test_svc_engine_bridge.py"
      - "tests/test_svc_studio_integration.py"
      - "infer/svc_cover_workflow.py"
      - "tools/svc_model_registry.py"
      - "ui/app.py"
      - "configs/svc_engines.json"
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: python -m pip install numpy soundfile
      - name: Compile standalone modules
        run: python -m py_compile infer/svc_engine_bridge.py infer/svc_cover_workflow.py tools/svc_model_registry.py tools/run_svc_engine.py tools/yingmusic_svc_worker.py tools/soulx_svc_worker.py ui/app.py tests/test_svc_engine_bridge.py tests/test_svc_studio_integration.py
      - name: Run bridge tests
        run: |
          python -m unittest discover -s tests -p test_svc_engine_bridge.py -v
          python -m unittest discover -s tests -p test_svc_studio_integration.py -v
