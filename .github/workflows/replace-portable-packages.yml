name: Replace existing portable packages

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: '已成功完成的四包构建运行 ID / Successful four-package build run ID'
        type: string
        required: true
      previous_sha:
        description: '现有版本标签的完整提交 / Exact existing version tag commit'
        type: string
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  replace:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Validate source build before downloading
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          python3 - <<'PY'
          import os
          from tools.replace_release_packages import verified_build
          verified_build(os.environ['GITHUB_REPOSITORY'], os.environ['BUILD_RUN_ID'])
          PY
      - name: Download all four original artifacts with digest verification
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 45
        with:
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          pattern: AI-RVC-*
          path: ${{ runner.temp }}/replacement-packages
          digest-mismatch: error
      - name: Verify and replace the existing version
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          PREVIOUS_SHA: ${{ inputs.previous_sha }}
        run: |
          python3 tools/replace_release_packages.py \
            --run-id "$BUILD_RUN_ID" --previous-sha "$PREVIOUS_SHA" \
            --packages "$RUNNER_TEMP/replacement-packages" \
            --receipt "$RUNNER_TEMP/replacement-receipt.json"
      - name: Preserve replacement receipt and previous asset identities
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: portable-replacement-receipt
          path: ${{ runner.temp }}/replacement-receipt.json
          if-no-files-found: warn
