name: Verify portable browser

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: '验证原始四包构建中的 Windows CPU 包 / Verify the original Windows CPU artifact'
        type: string
        required: true

permissions:
  contents: read
  actions: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  browser:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate original build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from tools.replace_release_packages import verified_build
          run = verified_build(os.environ['GITHUB_REPOSITORY'], os.environ['BUILD_RUN_ID'])
          output = Path(os.environ['RUNNER_TEMP']) / 'browser-evidence'
          output.mkdir()
          (output / 'source.json').write_text(json.dumps(run, indent=2), encoding='utf-8')
          PY
      - name: Download original Windows CPU package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 25
        with:
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          name: AI-RVC-Windows-CPU
          path: ${{ runner.temp }}/original-windows-cpu
          digest-mismatch: error
      - name: Prepare isolated browser CLI
        shell: pwsh
        run: |
          node --version
          npm --version
          npx --yes --package @playwright/cli@0.1.22 playwright-cli --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify archives, launch original executable and inspect both locales
        shell: pwsh
        run: |
          python tools/verify_portable_browser.py --archives "$env:RUNNER_TEMP/original-windows-cpu" --output "$env:RUNNER_TEMP/browser-evidence"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve browser screenshots and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: portable-browser-evidence
          path: ${{ runner.temp }}/browser-evidence
          if-no-files-found: error
