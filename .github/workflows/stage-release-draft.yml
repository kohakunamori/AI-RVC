name: Stage Verified Artifacts in Draft

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build Executables run ID
        required: true
        type: string
      source_sha:
        description: Exact source commit built by that run
        required: true
        type: string
      release_tag:
        description: Existing draft release tag matching VERSION
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: stage-draft-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify existing artifacts and attach unchanged files to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 tools/stage_release_draft.py
